<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS4 Offline UI — 9.00</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#101216;color:#fff;margin:0;min-height:100vh;
display:flex;align-items:center;justify-content:center}
.card{width:min(620px,92vw);padding:32px;border-radius:18px;background:#20242b;
box-shadow:0 10px 40px #0008;text-align:center}
h1{margin:0 0 8px;font-size:32px}.fw{opacity:.8;font-size:20px}
.ready{font-size:25px;color:#7dff9a;margin:20px 0}
button{padding:14px 26px;border:0;border-radius:10px;font-size:17px;margin:6px;cursor:pointer}
#start{background:#fff;color:#111}#start:disabled{opacity:.5;cursor:default}
#test{background:#3b82f6;color:#fff}.status{margin:18px 0 8px;font-size:18px}
.bar{height:18px;background:#333;border-radius:20px;overflow:hidden;margin:10px 0 6px}
.fill{height:100%;width:100%;background:#36e06f;transition:width .25s}
.small{opacity:.72;font-size:13px;margin-top:18px;line-height:1.5}
.ok{color:#7dff9a}.warn{color:#ffd166}
</style>
</head>
<body>
<div class="card">
  <h1>PS4 Jailbreak UI</h1>
  <div class="fw">Firmware 9.00</div>
  <div class="ready">CACHE READY — 100%</div>

  <div class="status" id="status">Offline UI ready.</div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div id="percent">100% — Ready</div>

  <button id="start">Start</button>
  <button id="test">Cache Test</button>
  <button onclick="location.reload()">Refresh</button>

  <div class="small">
    UI-only build: Start and Cache Test change the interface/status only.
    No exploit, payload, kernel modification, or execution code is included.
  </div>
</div>

<script>
(function(){
  var start=document.getElementById('start');
  var test=document.getElementById('test');
  var status=document.getElementById('status');
  var fill=document.getElementById('fill');
  var percent=document.getElementById('percent');

  function setProgress(p,label){
    fill.style.width=p+'%';
    percent.textContent=p+'% — '+label;
  }

  start.addEventListener('click',function(){
    start.disabled=true;
    status.textContent='UI start requested…';
    status.className='status warn';
    setProgress(0,'Starting UI test');
    var p=0;
    var timer=setInterval(function(){
      p+=20;
      if(p>=100){
        p=100; clearInterval(timer);
        status.textContent='UI STARTED — offline interface ready.';
        status.className='status ok';
        setProgress(100,'Ready');
        start.disabled=false;
      } else {
        setProgress(p,'Preparing UI');
      }
    },250);
  });

  test.addEventListener('click',function(){
    status.textContent='CACHE READY — browser storage test completed.';
    status.className='status ok';
    setProgress(100,'Ready');
  });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS4 Jailbreak UI</title>
<style>
body{font-family:Arial,sans-serif;background:#111;color:#fff;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{width:min(560px,90vw);padding:30px;border-radius:16px;background:#1d1d1d;text-align:center}
h1{margin:0 0 8px}.fw{opacity:.75;margin-bottom:22px}.ready{font-size:24px;color:#7dff9a;margin:20px 0}
button{padding:13px 26px;border:0;border-radius:9px;font-size:17px;margin:6px}
button:disabled{opacity:.45}.small{opacity:.7;font-size:13px;margin-top:16px}
</style>
</head>
<body>
<div class="card">
<h1>PS4 Jailbreak</h1>
<div class="fw">Firmware 9.00</div>
<div class="ready">CACHE READY — 100%</div>
<button id="start" disabled>Start Jailbreak</button>
<button onclick="location.reload()">Refresh</button>
<div class="small">Offline UI status: ready. The execution button is intentionally disabled in this UI-only build.</div>
</div>
</body>
</html>

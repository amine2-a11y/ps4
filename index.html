<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADMIRAL WEBKIT 6.72 - 13.00</title>
<style>
  /* Halaman statis (tanpa animasi): PNG utuh Sanji Diable Jambe buatan user
     di tengah layar + status exploit + spinner loading bulat.
     Elemen wajib chain TIDAK diubah: #state, #out, import chain_poops.js. */
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#07090d}
  body{font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif}

  /* Gambar mengisi layar (rasio asli dijaga), glow halus statis. */
  #art{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
       max-width:100vw;max-height:100vh;z-index:1;
       filter:drop-shadow(0 0 24px rgba(255,94,0,.18))}

  /* HUD status exploit di bawah tengah. */
  #hud{position:absolute;left:50%;bottom:4vh;transform:translateX(-50%);
       z-index:12;text-align:center;pointer-events:none}
  #brand{font-size:11px;font-weight:700;letter-spacing:.22em;color:#fff;
         text-shadow:0 1px 4px rgba(0,0,0,.95)}
  #credits{margin-top:5px;font:10px/1.25 Arial,sans-serif;color:#fff;
           text-shadow:0 1px 4px rgba(0,0,0,.95);
           letter-spacing:.03em;white-space:nowrap}
  #cache{margin-top:5px;font:11px/1.25 Arial,sans-serif;color:#728095;
         min-height:14px;letter-spacing:.04em}
  #cache.ok{color:#68aa83}
  #cache.warn{color:#c5a75f}
  #cachebar{width:min(320px,70vw);height:5px;margin:8px auto 0;background:rgba(255,255,255,.10);border-radius:99px;overflow:hidden}
  #cachefill{width:0%;height:100%;background:#ffbe50;transition:width .15s ease}
  #cachepct{margin-top:4px;font:9px/1.2 Arial,sans-serif;color:#8b97a8;min-height:11px}
  #cache.bad{color:#c87870}
  #state{margin-top:6px;font-size:19px;font-weight:700;color:#e6ebf2;
         min-height:28px;text-shadow:0 0 8px rgba(0,255,204,.35)}
  #state.warn{color:#d8c07f}
  #state.ok{color:#7fd0a0}
  #state.bad{color:#d08a7f}

  /* Spinner bulat di bawah status. */
  #spin{width:34px;height:34px;margin:12px auto 0;
        border:4px solid rgba(255,190,80,.18);
        border-top-color:#ffbe50;border-radius:50%;
        animation:rot 1s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}

  /* Log chain (debug): disembunyikan; tampil kalau ada "failed" atau ?debug=1. */
  #out{display:none;white-space:pre-wrap;font:11px/1.4 Consolas,monospace;
       background:rgba(10,13,18,.92);border-top:1px solid #1e2732;
       position:absolute;left:0;right:0;bottom:0;height:38vh;
       overflow-y:auto;padding:8px 12px;z-index:14;color:#9fb3c8}
  #out.visible{display:block}
</style>
</head>
<body>
<img id="art" src="sanji.png" alt="Sanji Diable Jambe">
<div id="hud">
  <div id="brand">ADMIRAL WEBKIT 6.72 - 13.00</div>
  <div id="credits">Special thanks to sonicps, egycnq, Theflow0, sleirsgoevy, abc, Al-Azif, ntfargo, zecoxao, slopkit &amp; contributors</div>
  <div id="cache">checking offline cache...</div>
  <div id="cachebar" aria-hidden="true"><div id="cachefill"></div></div>
  <div id="cachepct"></div>
  <div id="state">detecting firmware...</div>
  <div id="spin"></div>
</div>
<div id="out"></div>

<script>
  // Offline-cache UI: AppCache on older browsers may not emit reliable
  // progress events, so keep the indicator moving instead of leaving a
  // permanent spinner. This only reports UI/cache state; it does not change
  // any payload or exploit code.
  (function () {
    var cacheEl = document.getElementById('cache');
    var fillEl = document.getElementById('cachefill');
    var pctEl = document.getElementById('cachepct');
    var ac = window.applicationCache;
    var shown = 0;
    var timer = null;
    var done = false;
    var waited = 0;

    function render(text, kind, pct) {
      cacheEl.textContent = text;
      cacheEl.className = kind || '';
      if (typeof pct === 'number') {
        shown = Math.max(0, Math.min(100, pct));
        fillEl.style.width = shown + '%';
        pctEl.textContent = Math.round(shown) + '%';
      }
    }

    function stop() {
      done = true;
      if (timer) { clearInterval(timer); timer = null; }
    }

    function ready(text) {
      stop();
      render(text || 'offline cache ready', 'ok', 100);
    }

    if (!ac) {
      render('offline cache unavailable', 'bad', 0);
      return;
    }

    if (navigator.onLine === false) {
      ready('offline - loaded from cache');
      return;
    }

    // If the manifest was already processed before this page installed
    // its event listeners, AppCache will already be IDLE/UPDATEREADY and
    // no 'cached' event will arrive again. Handle that state explicitly.
    if (ac.status === window.applicationCache.IDLE) {
      ready('offline cache ready');
      return;
    }
    if (ac.status === window.applicationCache.UPDATEREADY) {
      ready('offline cache updated');
      return;
    }

    render('checking offline cache...', '', 0);

    // Older browsers may omit AppCache progress events. Do not pretend
    // that 90% means completion; wait for the real AppCache terminal event.
    timer = setInterval(function () {
      if (done) return;
      waited += 180;
      if (shown < 90) {
        shown += shown < 40 ? 2 : 1;
        render('saving offline cache...', 'warn', shown);
      } else {
        render('finalizing offline cache...', 'warn', 90);
      }
      if (waited >= 30000 && ac.status === window.applicationCache.DOWNLOADING) {
        stop();
        render('cache is still downloading - check server manifest/MIME', 'bad', 90);
      }
    }, 180);

    ac.addEventListener('checking', function () {
      render('checking offline cache...', '', Math.max(shown, 2));
    }, false);

    ac.addEventListener('downloading', function () {
      render('saving files for offline use...', 'warn', Math.max(shown, 5));
    }, false);

    ac.addEventListener('progress', function (event) {
      var pct = event.total ? (event.loaded / event.total) * 100 : Math.min(90, shown + 3);
      render('saving offline cache...', 'warn', Math.max(shown, pct));
    }, false);

    ac.addEventListener('cached', function () {
      ready('offline cache ready');
    }, false);

    ac.addEventListener('noupdate', function () {
      ready('offline cache ready');
    }, false);

    ac.addEventListener('updateready', function () {
      ready('offline cache updated');
    }, false);

    ac.addEventListener('obsolete', function () {
      stop();
      render('offline cache obsolete', 'bad', 0);
    }, false);

    ac.addEventListener('error', function () {
      stop();
      render(navigator.onLine === false ? 'offline cache active' :
        'offline cache failed - keep internet connected',
        navigator.onLine === false ? 'ok' : 'bad',
        navigator.onLine === false ? 100 : 0);
    }, false);
  })();

  // Status chain: beri warna sesuai isi; tampilkan log saat ada kegagalan.
  (function () {
    const stateEl = document.getElementById('state');
    const outEl = document.getElementById('out');
    setInterval(function () {
      const t = stateEl.textContent || '';
      stateEl.className =
        /failed|abort|missing/i.test(t) ? 'bad' :
        /done|running|ok/i.test(t) ? 'ok' :
        /warn|attempt/i.test(t) ? 'warn' : '';
      if (/failed|abort/i.test(t)) outEl.classList.add('visible');
    }, 400);
  })();
</script>
<script src="background-music.js"></script>
<script src="firmware-matrix.js"></script>
<script src="multifw-router.js"></script>
<script>
  // ?debug=1 menampilkan log lengkap chain (untuk troubleshooting).
  if (new URLSearchParams(location.search).get('debug') === '1') {
    document.getElementById('out').classList.add('visible');
  }
</script>
</body>
</html>

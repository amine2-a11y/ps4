<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS4 Offline UI</title>
<style>
body{font-family:Arial,sans-serif;background:#111;color:#fff;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{width:min(520px,90vw);padding:28px;border-radius:16px;background:#1d1d1d;text-align:center}
h1{margin:0 0 18px}.status{font-size:22px;margin:18px 0}.small{opacity:.75;font-size:14px}
button{padding:12px 22px;border:0;border-radius:9px;font-size:16px;cursor:pointer}
.ok{color:#7dff9a}.bad{color:#ff8d8d}
</style>
</head>
<body>
<div class="card">
<h1>PS4 Offline UI</h1>
<div id="status" class="status">Checking offline storage…</div>
<div id="detail" class="small"></div>
<br>
<button onclick="check()">Check again</button>
</div>
<script>
const KEY="ps4_ui_offline_test_v1";
function check(){
  try{
    localStorage.setItem(KEY,"ready");
    const ok=localStorage.getItem(KEY)==="ready";
    document.getElementById("status").textContent=ok?"OFFLINE UI READY":"OFFLINE UI NOT READY";
    document.getElementById("status").className="status "+(ok?"ok":"bad");
    document.getElementById("detail").textContent=navigator.onLine
      ?"Browser reports: online. Offline storage is available."
      :"Browser reports: offline. Offline storage is available.";
  }catch(e){
    document.getElementById("status").textContent="OFFLINE UI FAILED";
    document.getElementById("status").className="status bad";
    document.getElementById("detail").textContent=String(e);
  }
}
window.addEventListener("online",check);
window.addEventListener("offline",check);
check();
</script>
</body>
</html>

<!doctype html><html manifest="ps4jb.cache"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preparing Lapse Module</title><style>
:root{--bg:#07080c;--panel:rgba(10,13,20,.78);--line:rgba(255,255,255,.10);--text:#f4f7fb;--muted:#9aa6b5;--accent:#79ffb0;--accent2:#55b8ff}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:#07080c url("zombie_bg.jpg") center/cover fixed no-repeat;color:var(--text);font-family:Segoe UI,Arial,sans-serif;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(3,5,9,.38),rgba(3,5,9,.88));pointer-events:none}.shell{position:relative;z-index:1;width:min(92vw,820px);margin:0 auto;padding:34px 0 28px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.brand{font-weight:900;letter-spacing:3px;font-size:18px}.status{font:12px monospace;color:var(--accent);border:1px solid rgba(121,255,176,.25);padding:7px 10px;border-radius:999px;background:rgba(121,255,176,.06)}.hero{border:1px solid var(--line);border-radius:22px;padding:30px;background:linear-gradient(145deg,rgba(12,16,24,.84),rgba(6,8,13,.68));backdrop-filter:blur(8px);box-shadow:0 24px 80px rgba(0,0,0,.45)}h2{margin:0 0 8px;font-size:30px;letter-spacing:.5px} .sub{margin:0;color:var(--muted);font-size:14px}.action{display:flex;align-items:center;gap:14px;margin:25px 0 14px}.btn{appearance:none;border:1px solid rgba(121,255,176,.35);border-radius:13px;padding:13px 22px;font-size:16px;font-weight:800;color:#06110b;background:linear-gradient(135deg,var(--accent),#b5ffd2);box-shadow:0 8px 28px rgba(121,255,176,.12);cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.auto{color:var(--muted);font-size:13px}.auto input{accent-color:var(--accent)}#countdown{color:var(--text);font-weight:800}.consoleWrap{border:1px solid var(--line);border-radius:16px;background:rgba(2,4,8,.72);overflow:hidden}.consoleHead{padding:10px 14px;border-bottom:1px solid var(--line);font:11px monospace;color:var(--muted);letter-spacing:1px}.console{min-height:145px;margin:0;padding:15px;font:12px/1.65 monospace;color:#cdd6e0;white-space:pre-wrap;text-align:left}footer{text-align:center;color:#748091;font-size:11px;margin-top:15px}#hen_logo{position:fixed;top:18px;right:20px;width:96px;height:auto;z-index:3;opacity:.8;filter:drop-shadow(0 5px 15px rgba(0,0,0,.5))}.boot{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#05070b url("zombie_bg.jpg") center/cover no-repeat}.boot:after{content:"";position:absolute;inset:0;background:rgba(3,5,9,.78)}.bootBox{position:relative;z-index:1;width:min(86vw,470px);padding:25px;border:1px solid var(--line);border-radius:20px;background:rgba(6,9,15,.86);box-shadow:0 20px 70px rgba(0,0,0,.55)}.bootTitle{font-size:22px;font-weight:900;letter-spacing:3px}.bootSub{color:var(--muted);font-size:12px;margin:7px 0 16px}.bar{height:4px;background:#1b222d;border-radius:8px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .12s linear}.files{margin-top:12px;font:11px/1.8 monospace;color:#aeb8c5}@media(max-width:600px){.shell{padding-top:25px}.hero{padding:22px;border-radius:18px}h2{font-size:24px}.action{align-items:flex-start;flex-direction:column}#hen_logo{width:72px;right:12px;top:12px}}
.cacheShell{position:relative;z-index:1;width:min(90vw,600px);margin:0 auto;padding-top:18vh;text-align:center}.cacheCard{padding:28px;border:1px solid var(--line);border-radius:20px;background:rgba(6,9,15,.84)}.cacheTitle{font-size:24px;font-weight:900;letter-spacing:2px}.cacheSub{color:var(--muted);font-size:13px;margin:8px 0 20px}#console{min-height:110px;margin:0;padding:14px;text-align:left;font:12px/1.6 monospace;color:#cdd6e0;background:rgba(0,0,0,.35);border-radius:12px;white-space:pre-wrap}</style></head><body><main class="cacheShell"><div class="cacheCard"><div class="cacheTitle">LAPSE MODULE</div><div class="cacheSub">Preparing offline files…</div><pre id="console"></pre></div></main><script>
    // Clear history and prevent back navigation
    history.replaceState(null, null, 'index.html');
    var histlength = history.length;
    history.go(-histlength);
    // Logging utility
    var outputConsole = document.getElementById("console");
    window.log = function (msg) {
      outputConsole.textContent += msg + "\n";
    };
    // Download progress (% display)
    function DLProgress(e) {
      if (!e || !e.total) return;
      var percent = (Math.round((e.loaded / e.total) * 100));
      window.log("[CACHE] Downloading... " + percent + "% complete.");
    }
    // On cache complete
    function DisplayCacheProgress() {
      window.log(" ");
      window.log("[SUCCESS] Cache installed successfully.");
      window.log("Page will reload in 3 seconds...");
      // Delay to show success message before navigation
      setTimeout(function() { window.log("Reloading..."); }, 2000);
      // Navigate back to index.html to load the exploit from cache
      setTimeout(function() { location.reload(); }, 3000);
    }
    // On error
    function DLError(e) {
      window.log(" ");
      window.log("[CACHE ERROR] An error occured during Cache...");
      window.log("[CACHE ERROR] Check if payload.bin file included in the directory!!!");
    }
    // Event listeners
    window.applicationCache.addEventListener("progress", DLProgress, false);
    window.applicationCache.addEventListener("error", DLError, false);
    window.applicationCache.oncached = function(e) { DisplayCacheProgress(); };
    window.applicationCache.onupdateready = function(e) { DisplayCacheProgress(); };
    // Initialization message on DOM load
    document.addEventListener('DOMContentLoaded', function () {
      outputConsole.textContent = ""; // Clear console log
      window.log("AppCache download initiating...");
      window.log("Please wait, this may take a few seconds.");
    });
  </script>
</html>
</body></html>
